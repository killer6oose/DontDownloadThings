# Builds Snag for Android and Windows on every push to main, then publishes
# both as a GitHub release named after the version in pubspec.yaml.
# Run it by hand from the Actions tab with "Run workflow" too.
name: Build Snag

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.SNAG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Signs with the fixed Snag key when the repo secrets are set, so
      # updates install over the old version. Without them it uses a
      # throwaway debug key (fine for testing only).
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.SNAG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SNAG_KEYSTORE_PASSWORD }}
        if: env.HAS_KEY == 'true'
        run: |
          echo "$KEYSTORE" | base64 -d > android/snag.jks
          printf 'storeFile=snag.jks\nstorePassword=%s\nkeyAlias=snag\nkeyPassword=%s\n' "$STORE_PASSWORD" "$STORE_PASSWORD" > android/key.properties
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64
      - run: mv build/app/outputs/flutter-apk/app-release.apk Snag.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Snag.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      # yt-dlp and ffmpeg go in a tools folder beside Snag.exe. Snag keeps
      # yt-dlp up to date itself after that.
      - name: Add yt-dlp and ffmpeg
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force "$release/tools" | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$release/tools/yt-dlp.exe"
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Get-ChildItem ffmpeg -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination "$release/tools"
          Compress-Archive -Path "$release/*" -DestinationPath Snag-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Snag-Windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Read version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Snag ${{ steps.version.outputs.version }}
          body: |
            Phone: download Snag.apk on the phone and open it.
            PC: download Snag-Windows.zip, unzip it anywhere (e.g. Documents\Snag) and run Snag.exe.
          files: |
            android/Snag.apk
            windows/Snag-Windows.zip
          make_latest: true
