# Apache site for http://snag.adgoose on the Pi. See SETUP.md, "The web page on the Pi".
# Needs: sudo a2enmod proxy proxy_http rewrite headers
<VirtualHost *:80>
    ServerName snag.adgoose
    DocumentRoot /var/www/snag

    # Everything under /api/ goes to the Snag server (snag.service).
    ProxyPass        /api/ http://127.0.0.1:8790/api/
    ProxyPassReverse /api/ http://127.0.0.1:8790/api/
    # Looking up a big playlist can take a while.
    ProxyTimeout 300

    <Directory /var/www/snag>
        Require all granted
        AllowOverride None
        Options -Indexes

        # Anything that isn't a real file goes to the app.
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # Always check for a new version of the page itself.
    <FilesMatch "^(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/snag-error.log
    CustomLog ${APACHE_LOG_DIR}/snag-access.log combined
</VirtualHost>
